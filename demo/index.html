<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f8fb" />
    <meta
      name="description"
      content="Try the behavior-driven sprite-pet runtime with local and bundled 8×9 pet atlases."
    />
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <title>sprite-pet · behavior runtime</title>
  </head>
  <body>
    <!--
      THESIS: A living pet stage proves semantic browser behavior and refuses the atlas-inspector workbench.
      OWN-WORLD: Cool daylight, white glass cards, indigo interaction, green live status, rounded operating controls.
      STORY: Pick a pet, trigger behavior, observe its source-state mapping, then manipulate or download its portable package.
      FIRST VIEWPORT: Oversized promise and compact controls left; one dominant pet habitat right; picker bridges both.
      FORM: Accepted runtime-refactor experience; behavior-first split stage; migration branch codex/runtime-refactor.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <main class="app-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">sprite-pet · behavior runtime</p>
        <h1 id="page-title">让旧雪碧图，拥有新的生活。</h1>
        <p class="lede">
          不再依赖对话状态。它会观察鼠标、回应点击、跟随拖动，也会自己发呆、活跃和休息。
        </p>

        <div class="controls" aria-label="宠物互动">
          <button type="button" data-trigger="celebrate">一起庆祝</button>
          <button type="button" data-trigger="surprised">吓它一跳</button>
          <button type="button" data-trigger="active">让它活动</button>
        </div>

        <button
          id="floating-toggle"
          class="mode-toggle"
          type="button"
          role="switch"
          aria-checked="false"
        >
          <span class="mode-toggle-copy">
            <strong>页面悬浮</strong>
            <small>让宠物覆盖在当前网页上方</small>
          </span>
          <span class="mode-toggle-switch" aria-hidden="true"><span></span></span>
          <span id="floating-status" class="mode-toggle-status">关闭</span>
        </button>

        <section class="pet-library" aria-labelledby="pet-library-title">
          <div class="pet-library-heading">
            <h2 id="pet-library-title">选择宠物</h2>
            <span id="pet-count">正在发现本机宠物…</span>
          </div>
          <div id="pet-picker" class="pet-picker" aria-label="宠物列表"></div>
        </section>

        <div class="mapping-card">
          <div>
            <span>Codex 原动画</span>
            <strong id="source-state">idle</strong>
          </div>
          <span class="mapping-arrow" aria-hidden="true">→</span>
          <div>
            <span>Web 宠物行为</span>
            <strong id="behavior-state">待机</strong>
          </div>
        </div>
      </section>

      <section id="pet-card" class="pet-card" aria-label="互动宠物演示">
        <div class="ambient-orb ambient-orb-one"></div>
        <div class="ambient-orb ambient-orb-two"></div>
        <div id="pet-stage" class="pet-stage">
          <div id="pet-shell" class="pet-shell" role="group" aria-label="宠物互动与大小调节">
            <button
              id="pet-interaction-target"
              class="pet-interaction-target"
              type="button"
              aria-label="与宠物互动"
              aria-describedby="pet-hint"
            >
              <span id="pet-sprite" class="pet-sprite"></span>
            </button>
            <span class="pet-resize-hit-target">
              <button
                id="pet-resize-handle"
                class="pet-resize-handle"
                type="button"
                aria-label="调节宠物大小"
              >
                <svg viewBox="0 0 12 12" aria-hidden="true">
                  <path
                    d="M1.75 5V1.75H5M7 10.25h3.25V7M2 2l8 8"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                  />
                </svg>
              </button>
            </span>
          </div>
        </div>
        <div class="pet-meta">
          <div class="pet-meta__identity">
            <span class="status-dot"></span>
            <strong id="pet-name">正在载入…</strong>
          </div>
          <div class="pet-meta__actions">
            <p id="pet-hint">试试靠近、点击、拖动，或调节右下角大小</p>
            <a id="pet-download" class="pet-download" href="" download hidden>
              <span>下载宠物包</span>
              <span aria-hidden="true">↓</span>
            </a>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
